# ScudDocs API Gateway Configuration
# Единая точка входа для всех микросервисов на порту 80

<VirtualHost *:80>
    # Установка ServerName для подавления warning
    ServerName localhost

    # Кодировка UTF-8 по умолчанию
    AddDefaultCharset UTF-8

    # MIME-типы для статических ресурсов фронтенда
    AddType application/json             .json .map
    AddType application/javascript       .js .mjs
    AddType text/css                     .css
    AddType font/woff2                   .woff2
    AddType font/woff                    .woff
    AddType font/ttf                     .ttf
    AddType font/otf                     .otf
    AddType image/svg+xml                .svg .svgz
    AddType image/webp                   .webp
    AddType image/avif                   .avif
    AddType image/x-icon                 .ico

    # Логирование
    LogLevel info
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined

    # =================================================================
    # JWT AUTHENTICATION via mod_lua
    # Проверяет Bearer token для всех /api/v1/* (кроме /api/v1/auth/*)
    # =================================================================

    # Путь для `require` общих Lua-модулей (scud_common).
    LuaPackagePath /etc/apache2/lua/?.lua

    # Ролевая раздача статики (translate_name). DECLINE'ит /api/v1 и служебные
    # пути — существующий ACM-путь неизменен.
    LuaHookTranslateName /etc/apache2/lua/static_route.lua static_route

    LuaHookAccessChecker /etc/apache2/lua/jwt_auth.lua check_auth

    # =================================================================
    # CORS Headers + security headers
    # =================================================================
    # ${CORS_ALLOWED_ORIGIN} читается из docker-env через `Define` в Dockerfile
    # entrypoint (envsubst). Дефолт `*` оставлен только для dev/test;
    # в prod конкретный origin фронтенда обязателен (Access-Control-Allow-Credentials
    # с `*` несовместим, а cookie уже Secure+SameSite=Strict).
    Header always set Access-Control-Allow-Origin "${CORS_ALLOWED_ORIGIN}"
    Header always set Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS"
    Header always set Access-Control-Allow-Headers "Content-Type, Authorization"
    Header always set Access-Control-Max-Age "3600"

    # Anti-MIME-sniffing / clickjacking / referrer policy
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    # HSTS: говорим браузеру всегда использовать HTTPS. `env=HTTPS` чтобы
    # заголовок не выставлялся при HTTP (TLS termination на reverse-proxy
    # выше выставит HTTPS=on; на чистом HTTP заголовок бесполезен).
    Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains" "expr=%{HTTPS} == 'on'"

    # Permissions-Policy: запрет браузерных API, не нужных СКУД-фронтенду.
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=()"

    # Content-Security-Policy: жёсткая политика для production-vhost.
    #   img-src * data: blob:       — изображения разрешены из любого источника
    #       (`*` — любой http(s)-origin; data:/blob: — inline/base64-картинки,
    #       напр. фото вскрытия/доступа).
    #   script-src 'self'           — без `unsafe-inline`: этот vhost НЕ отдаёт
    #       инлайн-скриптов (Redoc/Swagger UI живут в отдельном
    #       docker-compose.docs.yaml, а образ gateway не бандлит SPA с инлайном).
    #       Снятие `unsafe-inline` убирает XSS-усилитель (SEC-17). Если SPA
    #       когда-либо понадобятся инлайн-скрипты — добавлять nonce/hash, а не
    #       `unsafe-inline`.
    #   base-uri 'self'             — запрет подмены <base> (SEC-22).
    #   object-src 'none'           — запрет <object>/<embed>/Flash (SEC-22).
    #   form-action 'self'          — формы постятся только на свой origin (SEC-22).
    # style-src сохраняет 'unsafe-inline' (инлайн-стили фронтенда), остальные
    # положительные директивы (frame-ancestors 'none') без изменений.
    Header always set Content-Security-Policy "default-src 'self'; img-src * data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; frame-ancestors 'none'"

    # =================================================================
    # REAL CLIENT IP за TLS-терминатором (SEC-07)
    # =================================================================
    # mod_remoteip вычисляет настоящий клиентский IP и подменяет им
    # REMOTE_ADDR — но ТОЛЬКО когда соединение пришло с доверенного хопа
    # (RemoteIPInternalProxy). За nginx/HAProxy-терминатором, который
    # ставит `X-Real-IP: $remote_addr`, Apache возьмёт IP клиента из этого
    # заголовка. При ПРЯМОМ (недоверенном) соединении заголовок X-Real-IP
    # от клиента ИГНОРИРУЕТСЯ — REMOTE_ADDR остаётся реальным IP клиента,
    # подделать его нельзя.
    #
    # ${TRUSTED_PROXY_CIDR} подставляется entrypoint.sh из env
    # (deployment-specific адрес терминатора). Дефолт — loopback, под
    # документированную схему nginx → 127.0.0.1:80 (см. backend/DEPLOYMENT.md
    # "TLS termination"). В production укажите CIDR/адрес вашего терминатора.
    RemoteIPHeader X-Real-IP
    RemoteIPInternalProxy ${TRUSTED_PROXY_CIDR}

    # X-Real-IP для бэкендов: после mod_remoteip REMOTE_ADDR = настоящий
    # клиентский IP в ОБЕИХ топологиях (прямое соединение И за терминатором).
    # Перезаписываем X-Real-IP этим выверенным значением — так подделанный
    # на прямом соединении заголовок гарантированно затирается, а Tornado
    # (`xheaders=True`) читает корректный request.remote_ip. Без этого
    # rate-limit в auth_api схлопывался на один общий IP терминатора.
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"

    # Обработка preflight OPTIONS requests (до Lua hook)
    RewriteEngine On
    RewriteCond %{REQUEST_METHOD} OPTIONS
    RewriteRule ^(.*)$ $1 [R=200,L]

    # =================================================================
    # СТАТИЧЕСКИЕ ФАЙЛЫ FRONTEND
    # =================================================================

    DocumentRoot /var/www/public

    # --- PUBLIC (login + libs + shared assets) — кэшируемо, без авторизации ---
    <Directory /var/www/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule \.(js|mjs|css|json|map|woff2?|ttf|otf|svg|svgz|webp|avif|ico|png|jpg|jpeg|gif|wasm)$ - [R=404,L]
        FallbackResource /login.html
    </Directory>

    # --- РОЛЕВЫЕ БАНДЛЫ — no-store (защита от кросс-ролевого кэша) ---
    <Directory /var/www/roles/worker>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        Header always set Cache-Control "no-store"
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule \.(js|mjs|css|json|map|woff2?|ttf|otf|svg|svgz|webp|avif|ico|png|jpg|jpeg|gif|wasm)$ - [R=404,L]
        FallbackResource /main.html
    </Directory>

    <Directory /var/www/roles/operator>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        Header always set Cache-Control "no-store"
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule \.(js|mjs|css|json|map|woff2?|ttf|otf|svg|svgz|webp|avif|ico|png|jpg|jpeg|gif|wasm)$ - [R=404,L]
        FallbackResource /main.html
    </Directory>

    <Directory /var/www/roles/admin>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        Header always set Cache-Control "no-store"
        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule \.(js|mjs|css|json|map|woff2?|ttf|otf|svg|svgz|webp|avif|ico|png|jpg|jpeg|gif|wasm)$ - [R=404,L]
        FallbackResource /main.html
    </Directory>

    # Статические файлы (JS, CSS, шрифты, изображения и т.д.) —
    # не требуют авторизации и отдаются напрямую.
    # Lua-хук jwt_auth.lua уже пропускает всё вне /api/v1/*,
    # но явный блок гарантирует Require all granted без лишних проверок.
    <LocationMatch "\.(js|mjs|css|json|map|woff2?|ttf|otf|svg|svgz|webp|avif|ico|png|jpg|jpeg|gif|html|txt|xml|wasm)$">
        Require all granted
    </LocationMatch>

    # =================================================================
    # INTERNAL ENDPOINTS — закрыты снаружи
    # Lua обращается к auth_api напрямую через curl, ProxyPass не нужен
    # =================================================================

    ProxyPreserveHost On
    ProxyTimeout 300

    # /internal/* и /acm/* закрыты для прямого внешнего доступа
    <Location /internal>
        ProxyPass !
        Require all denied
    </Location>

    <Location /acm>
        ProxyPass !
        Require all denied
    </Location>

    # /metrics закрыт ЯВНО (ARC-04). Сейчас он недоступен снаружи лишь по
    # отсутствию ProxyPass — хрупко: широкий ProxyPass, добавленный позже,
    # случайно проксировал бы Prometheus-экспозицию всех сервисов наружу.
    # Явный `ProxyPass !` + `Require all denied` гарантирует deny при любой
    # будущей конфигурации проксирования. Scrape идёт по backend_net напрямую.
    <Location /metrics>
        ProxyPass !
        Require all denied
    </Location>

    # =================================================================
    # AUTH API — порт 8003
    # Маршруты: /api/v1/auth/* (публичные, без JWT проверки)
    # timeout=60 (и у /locker*): логин и step-up синхронно ждут SMS-шлюз
    # (цепочка 43 < 45 < 50 с, см. DEPLOYMENT.md), должен быть больше 50.
    # =================================================================

    ProxyPass        /api/v1/auth http://auth_api:8003/api/v1/auth retry=0 timeout=60
    ProxyPassReverse /api/v1/auth http://auth_api:8003/api/v1/auth

    # =================================================================
    # USER API — порт 8000
    # Маршруты: /users, /contractors, /accesses,
    #           /emergency-request/{id}, /emergency-requests
    # =================================================================

    ProxyPass        /api/v1/user/ http://user_api:8000/api/v1/user/ retry=0 timeout=30
    ProxyPassReverse /api/v1/user/ http://user_api:8000/api/v1/user/

    ProxyPass        /api/v1/users http://user_api:8000/api/v1/users retry=0 timeout=30
    ProxyPassReverse /api/v1/users http://user_api:8000/api/v1/users

    ProxyPass        /api/v1/contractor/ http://user_api:8000/api/v1/contractor/ retry=0 timeout=30
    ProxyPassReverse /api/v1/contractor/ http://user_api:8000/api/v1/contractor/

    ProxyPass        /api/v1/contractors http://user_api:8000/api/v1/contractors retry=0 timeout=30
    ProxyPassReverse /api/v1/contractors http://user_api:8000/api/v1/contractors

    ProxyPass        /api/v1/access/ http://user_api:8000/api/v1/access/ retry=0 timeout=30
    ProxyPassReverse /api/v1/access/ http://user_api:8000/api/v1/access/

    ProxyPass        /api/v1/accesses http://user_api:8000/api/v1/accesses retry=0 timeout=30
    ProxyPassReverse /api/v1/accesses http://user_api:8000/api/v1/accesses

    ProxyPass        /api/v1/emergency-request/ http://user_api:8000/api/v1/emergency-request/ retry=0 timeout=30
    ProxyPassReverse /api/v1/emergency-request/ http://user_api:8000/api/v1/emergency-request/

    ProxyPass        /api/v1/emergency-requests http://user_api:8000/api/v1/emergency-requests retry=0 timeout=30
    ProxyPassReverse /api/v1/emergency-requests http://user_api:8000/api/v1/emergency-requests

    # =================================================================
    # LOCKER API — порт 8001
    # Маршруты: /lockers, /sensor-types
    # =================================================================

    ProxyPass        /api/v1/locker/ http://locker_api:8001/api/v1/locker/ retry=0 timeout=60
    ProxyPassReverse /api/v1/locker/ http://locker_api:8001/api/v1/locker/

    ProxyPass        /api/v1/lockers http://locker_api:8001/api/v1/lockers retry=0 timeout=60
    ProxyPassReverse /api/v1/lockers http://locker_api:8001/api/v1/lockers

    ProxyPass        /api/v1/sensor-types http://locker_api:8001/api/v1/sensor-types retry=0 timeout=30
    ProxyPassReverse /api/v1/sensor-types http://locker_api:8001/api/v1/sensor-types

    # =================================================================
    # HISTORY API — порт 8002
    # Маршруты: /telemetry, /events, /commands/history, /media, /analytics
    # =================================================================

    ProxyPass        /api/v1/telemetry http://history_api:8002/api/v1/telemetry retry=0 timeout=30
    ProxyPassReverse /api/v1/telemetry http://history_api:8002/api/v1/telemetry

    ProxyPass        /api/v1/events http://history_api:8002/api/v1/events retry=0 timeout=30
    ProxyPassReverse /api/v1/events http://history_api:8002/api/v1/events

    ProxyPass        /api/v1/commands/history http://history_api:8002/api/v1/commands/history retry=0 timeout=30
    ProxyPassReverse /api/v1/commands/history http://history_api:8002/api/v1/commands/history

    ProxyPass        /api/v1/media http://history_api:8002/api/v1/media retry=0 timeout=30
    ProxyPassReverse /api/v1/media http://history_api:8002/api/v1/media

    ProxyPass        /api/v1/analytics http://history_api:8002/api/v1/analytics retry=0 timeout=30
    ProxyPassReverse /api/v1/analytics http://history_api:8002/api/v1/analytics

    # =================================================================
    # NOTIFICATION API — порт 8005
    # Маршруты: /notifications, /notification/{id}
    # =================================================================

    ProxyPass        /api/v1/notification/ http://notification_api:8005/api/v1/notification/ retry=0 timeout=30
    ProxyPassReverse /api/v1/notification/ http://notification_api:8005/api/v1/notification/

    ProxyPass        /api/v1/notifications http://notification_api:8005/api/v1/notifications retry=0 timeout=30
    ProxyPassReverse /api/v1/notifications http://notification_api:8005/api/v1/notifications

    # =================================================================
    # REPORTS API — порт 8006
    # Маршруты: /reports (коллекция), /report/{id}, /report/{id}/download
    # Длинный timeout — выгрузка готовых файлов отчётов.
    # =================================================================

    ProxyPass        /api/v1/reports http://reports_api:8006/api/v1/reports retry=0 timeout=300
    ProxyPassReverse /api/v1/reports http://reports_api:8006/api/v1/reports

    ProxyPass        /api/v1/report/ http://reports_api:8006/api/v1/report/ retry=0 timeout=300
    ProxyPassReverse /api/v1/report/ http://reports_api:8006/api/v1/report/

    # =================================================================
    # Health Check Endpoint
    # Минимальный 200 OK через Lua-обработчик. mod_status исключён, чтобы
    # не раскрывать публично версию Apache, worker-state и URL запросов.
    # =================================================================

    <Location /health>
        ProxyPass !
        SetHandler lua-script
        LuaMapHandler ".*" /etc/apache2/lua/health.lua handle
        Require all granted
    </Location>

</VirtualHost>
