# =================================================================
# Prefork MPM tuning — pin the worker ceiling explicitly.
# =================================================================
# Назначение: сделать потолок одновременных соединений ЯВНЫМ и
# совпадающим с тем, что показывает mod_status.
#
# Шлюз работает на prefork MPM (один процесс на соединение), поэтому
# число воркеров = число одновременных HTTP-соединений (устройства
# ходят через MQTT-брокер напрямую, минуя Apache, — на шлюз приходят
# только REST-запросы клиентов/сервисов). Это и есть тот потолок,
# который видит дашборд «SCUD Gateway».
#
# Почему ServerLimit == MaxRequestWorkers:
#   * Длина scoreboard в выводе server-status?auto = ServerLimit. Метрика
#     мониторинга scud.gateway.slots_total берёт эту длину как знаменатель
#     worker_util_pct. Если ServerLimit (по умолчанию может быть 256)
#     разойдётся с MaxRequestWorkers (150), worker_util_pct никогда не
#     достигнет 100 %, и триггеры насыщения (85 %/95 %) не сработают.
#   * Фиксируя ServerLimit = MaxRequestWorkers, гарантируем slots_total ==
#     реальный потолок независимо от дефолтов базового образа.
#
# Значение 150 = текущий потолок штатного mpm_prefork.conf образа
# (поведение НЕ меняется, только закрепляется явно). Если потребуется
# больше одновременных соединений через шлюз (крупный парк устройств),
# поднимайте ОБА значения синхронно — это решение про ёмкость/память
# (каждый prefork-процесс ~несколько МБ), а не про мониторинг.
<IfModule mpm_prefork_module>
    ServerLimit         150
    MaxRequestWorkers   150
</IfModule>
