# =================================================================
# Internal-only Apache mod_status endpoint for monitoring.
# =================================================================
# Назначение: отдать машинно-читаемую статистику воркеров/соединений
# (server-status?auto) системе мониторинга, НЕ раскрывая её наружу.
#
# Почему отдельный порт 81, а НЕ публичный vhost :80:
#   * server-status светит worker-state, URL запросов в обработке и IP
#     клиентов — публиковать это на :80 нельзя (см. комментарий в
#     gateway/Dockerfile, исторически mod_status был выключен целиком).
#   * Порт 81 НЕ публикуется в docker-compose (`ports:` только "80:80"),
#     поэтому он достижим лишь контейнер-в-контейнер внутри backend_net —
#     ровно как /metrics бэкендов, недоступные снаружи по отсутствию
#     публикации. zabbix_server (тоже в backend_net) скрейпит
#     http://apache_gateway:81/server-status?auto HTTP-агент-итемом.
#   * Публичный vhost :80 (sites-enabled/gateway.conf) НЕ содержит
#     server-status вовсе — никакой конфиг проксирования его не откроет.
#
# ExtendedStatus — глобальная директива mod_status; включает поля
# ReqPerSec/BytesPerSec/CPULoad/Total Accesses и полный scoreboard в
# выводе ?auto. Небольшой overhead (gettimeofday на запрос) приемлем.
ExtendedStatus On

# Внутренний слушатель. Не публикуется наружу (см. docker-compose.yaml).
Listen 81

<VirtualHost *:81>
    ServerName localhost

    # По умолчанию на этом vhost всё закрыто; открыт только статус-хендлер.
    <Location />
        Require all denied
    </Location>

    # Машинно-читаемая статистика для агента мониторинга. Доступ ограничен
    # сетевой изоляцией порта 81 (backend_net), как и /metrics бэкендов.
    # LocationMatch с якорями ^…$ — точное совпадение, чтобы /server-statusXYZ
    # не попадал под этот handler (хоть и недоступен снаружи — defense-in-depth).
    <LocationMatch "^/server-status$">
        SetHandler server-status
        Require all granted
    </LocationMatch>
</VirtualHost>
