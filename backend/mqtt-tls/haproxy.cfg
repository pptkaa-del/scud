global
    log stdout format raw daemon info
    maxconn 4096
    user haproxy
    group haproxy
    stats socket /var/lib/haproxy/admin.sock mode 660 level admin
    tune.ssl.default-dh-param 2048
    ssl-default-bind-options ssl-min-ver TLSv1.2 ssl-max-ver TLSv1.2 no-tls-tickets
    ssl-default-bind-ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES256-SHA:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-SHA:DHE-RSA-AES256-SHA:AES128-GCM-SHA256:AES256-GCM-SHA384:AES128-SHA256:AES256-SHA256:AES128-SHA:AES256-SHA:@SECLEVEL=1

resolvers docker
    nameserver embedded 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 10s
    hold nx 5s
    hold other 5s
    hold obsolete 5s

defaults
    mode tcp
    log global
    option tcplog
    option dontlognull
    option tcpka
    timeout connect 10s
    timeout client 600s
    timeout server 600s
    timeout tunnel 600s
    timeout client-fin 30s
    timeout server-fin 30s

frontend mqtt_tls_in
    bind :8883 ssl crt /etc/haproxy/certs/server.pem
    maxconn 4000
    stick-table type ip size 10k expire 60s store conn_rate(10s)
    tcp-request connection track-sc0 src
    tcp-request connection reject if { sc0_conn_rate gt 30 }
    # Сессия, не приславшая ни байта после хендшейка, до брокера не доходит:
    # healthcheck и сканеры не засоряют лог mosquitto.
    tcp-request inspect-delay 10s
    tcp-request content accept if { req.len gt 0 }
    tcp-request content reject
    default_backend mqtt_plain

backend mqtt_plain
    # init-addr без libc: синхронный libc-резолв вешает мастер до форка воркера,
    # и :8883 не биндится вовсе. Живость брокера сторожит healthcheck сервиса mqtt.
    server broker mqtt:1883 resolvers docker init-addr last,none
