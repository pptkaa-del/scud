# Mosquitto 2.0.23 — ScudDocs relay broker (Phase 1: plaintext, TLS deferred)
listener 1883 0.0.0.0
protocol mqtt

# Drop privileges (image runs entrypoint as root only to allow this drop).
user mosquitto

# No anonymous access: service user + per-device relay-{id} users only.
# password_file/acl_file live on a WRITABLE shared volume so provisioning
# (Plan 2) can append per-device entries; a watcher SIGHUPs mosquitto to reload.
allow_anonymous false
password_file /mosquitto/config/passwordfile
acl_file /mosquitto/config/aclfile

# Keepalive tolerance for device keepAlive=95s (see protocol doc §4)
max_keepalive 0

# SEC-04: верхняя граница PUBLISH payload. Брокер режет oversized-кадр до того,
# как он дойдёт до backend (defence-in-depth поверх MAX_RELAY_PHOTO_BYTES в
# relay_codec). 10 МиБ photo-тело + 20-байтовый header + запас на MQTT-обвязку.
# Legit stat (<=52 B) / rep (12 B) / photo (<=~10 МиБ) проходят без проблем.
message_size_limit 10486784

persistence false
log_dest stdout
log_type error
log_type warning
log_type notice
# `information` carries the startup banner ("mosquitto version X.Y.Z running")
# and listener-bind line — needed for operational visibility / healthcheck logs.
log_type information
