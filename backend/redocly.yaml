# Redocly CLI config for CI OpenAPI well-formedness validation.
#
# Goal: catch genuinely broken specs (unparseable YAML, unresolvable / dangling
# $ref) across all service specs, WITHOUT drowning in 3.0-vs-3.1 style nitpicks.
#
# The specs are authored as OpenAPI 3.2.0 but still use the 3.0-era
# `nullable: true` keyword (instead of `type: [x, "null"]`). Migrating that is a
# separate, large change; here we only assert the documents parse and their
# cross-file references resolve. So we start from the lightest built-in ruleset
# (`minimal`) and explicitly disable the structural / style rules that only fire
# on the `nullable` legacy form, keeping `no-unresolved-refs` as a hard error.
#
# Run via the committed linters image:
#   docker compose --profile lint run --rm linters \
#     sh -c 'for s in services/*/openapi/openapi.yaml; do \
#              redocly lint "$s" --config redocly.yaml || exit 1; done'

extends:
  - minimal

rules:
  # Hard well-formedness guarantee: every $ref (incl. cross-file) must resolve.
  no-unresolved-refs: error

  # Disabled — style / 3.1-strictness noise on the existing 3.2.0 + `nullable`
  # specs. Re-enable in a dedicated spec-modernisation pass, not here.
  struct: off
  no-invalid-media-type-examples: off
  security-defined: off
  operation-operationId: off
  operation-4xx-response: off
  info-license: off
  no-server-example.com: off
  no-unused-components: off
  no-empty-servers: off
