RemoteUser:
  type: apiKey
  in: header
  name: X-Remote-User
  description: |
    Аутентификация через заголовок X-Remote-User для History API.
    В заголовке передается ID аутентифицированного пользователя.

    Trust Boundary:
    - Аутентификация выполняется на API Gateway
    - History API доверяет прокинутому user-context
    - НЕ выполняется валидация пользователя в БД
    - User ID используется только для логирования (uploaded_by, resolved_by)

    Система проверяет:
    1. Наличие заголовка X-Remote-User
    2. Корректность формата (целое число)

    При отсутствии заголовка или некорректных данных возвращается 401 Unauthorized.
    Некоторые эндпоинты (например, от locker_api) могут работать без этого заголовка.

    Пример: X-Remote-User: 1
