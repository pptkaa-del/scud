    EventId:
      $ref: './schemas/common_fields.yaml#/EventId'
    CommandHistoryId:
      $ref: './schemas/common_fields.yaml#/CommandHistoryId'
    AggregationId:
      $ref: './schemas/common_fields.yaml#/AggregationId'
    LockerId:
      $ref: './schemas/common_fields.yaml#/LockerId'
    SensorId:
      $ref: './schemas/common_fields.yaml#/SensorId'
    CommandId:
      $ref: './schemas/common_fields.yaml#/CommandId'
    UserId:
      $ref: './schemas/common_fields.yaml#/UserId'
    SensorTypeCode:
      $ref: './schemas/common_fields.yaml#/SensorTypeCode'
    Timestamp:
      $ref: './schemas/common_fields.yaml#/Timestamp'
    Metadata:
      $ref: './schemas/common_fields.yaml#/Metadata'

    # Errors
    ProblemDetails:
      $ref: './schemas/error.yaml#/ProblemDetails'

    # Telemetry
    SensorTelemetry:
      $ref: './schemas/telemetry.yaml#/SensorTelemetry'
    TelemetryReading:
      $ref: './schemas/telemetry.yaml#/TelemetryReading'
    TelemetryBatchRequest:
      $ref: './schemas/telemetry.yaml#/TelemetryBatchRequest'
    TelemetryBatchResponse:
      $ref: './schemas/telemetry.yaml#/TelemetryBatchResponse'
    TelemetryListResponse:
      $ref: './schemas/telemetry.yaml#/TelemetryListResponse'

    # Security Events
    EventSeverity:
      $ref: './schemas/security_event.yaml#/EventSeverity'
    SecurityEvent:
      $ref: './schemas/security_event.yaml#/SecurityEvent'
    SecurityEventCreate:
      $ref: './schemas/security_event.yaml#/SecurityEventCreate'
    SecurityEventListResponse:
      $ref: './schemas/security_event.yaml#/SecurityEventListResponse'

    # Command History
    CommandHistory:
      $ref: './schemas/command_history.yaml#/CommandHistory'
    CommandHistoryCreate:
      $ref: './schemas/command_history.yaml#/CommandHistoryCreate'
    CommandHistoryListResponse:
      $ref: './schemas/command_history.yaml#/CommandHistoryListResponse'

    # Media
    MediaKind:
      $ref: './schemas/media.yaml#/MediaKind'
    LockerMedia:
