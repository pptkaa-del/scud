MediaKind:
  type: string
  enum: [photo]
  description: Тип медиа-файла

LockerMedia:
  type: object
  required:
    - id
    - locker_id
    - kind
    - mime_type
    - size_bytes
    - captured_at
    - uploaded_at
  properties:
    id:
      type: integer
      format: int64
    locker_id:
      type: string
      format: uuid
    sensor_id:
      type: string
      format: uuid
      nullable: true
    security_event_id:
      type: integer
      format: int64
      nullable: true
      description: Связь с событием безопасности
    kind:
      $ref: '#/MediaKind'
    mime_type:
      type: string
      example: image/jpeg
    size_bytes:
      type: integer
    width:
      type: integer
      nullable: true
    height:
      type: integer
      nullable: true
    duration_ms:
      type: integer
      nullable: true
      description: Длительность; для photo всегда null
    captured_at:
      type: string
      format: date-time
    uploaded_at:
      type: string
      format: date-time
    description:
      type: string
      nullable: true
    metadata:
      type: object
      additionalProperties: true
      description: |
        Свободный объект. Для кадра relay-фото содержит:
        `relay_event_id` (uint32, event_id платы), `photo_id` (1..16, номер
        кадра в серии), `photos_cnt` (число кадров, объявленное платой),
        `series_uid` (uuid серии). У legacy-записей — пустой объект.

MediaListResponse:
  type: object
  required: [items, total, limit, offset]
  properties:
    items:
      type: array
      items:
        $ref: '#/LockerMedia'
    total:
      type: integer
    limit:
      type: integer
    offset:
      type: integer
