openapi: 3.2.0
info:
  title: Locker API
  description: |
    API для управления телекоммуникационными шкафами в системе ScudDocs СКУД.

    ## Аутентификация

    ### Control Gateway (REST API)
    - Заголовок `X-Remote-User` с ID пользователя
    - Аутентификация выполняется на API Gateway
    - Locker API доверяет прокинутому user-context

    ### Device Gateway (MQTT)
    - Релейные платы (transport='mqtt') подключаются к брокеру;
      идентифицируются через `relay_id`
    - Описание протокола: см. [openapi_relay.md](./openapi_relay.md)
  version: 1.1.0
  contact:
    name: SCUDDEV

servers:
  - url: http://localhost:8001/api/v1
    description: Local development server

tags:
  - name: Lockers
    description: Операции с шкафами
  - name: Sensor Types
    description: Управление типами датчиков
  - name: Sensors
    description: Операции с датчиками
  - name: Thresholds
    description: Управление пороговыми значениями
  - name: Commands
    description: Управление командами
  - name: Relays
    description: Блок реле платы шкафа

security:
  - RemoteUser: []

paths:
  # внутренний Prometheus-эндпоинт. Без auth, доступен только из
  # backend_net — Apache gateway не проксирует /metrics наружу.
  /metrics:
    get:
      summary: Prometheus metrics endpoint
      description: |
        Внутренний эндпоинт Prometheus scrape. Не требует аутентификации,
        доступен только из docker-сети `backend_net`. Apache gateway
        НЕ проксирует `/metrics` наружу — внешний клиент получит 404.
      tags:
        - internal
      responses:
        '200':
          description: Prometheus exposition format
          content:
            text/plain; version=0.0.4:
              schema:
                type: string

  /live:
    get:
      tags:
        - health
      summary: Liveness probe (process is up; no dependency I/O)
      operationId: getLive
      security: []
      responses:
        '200':
          description: Process alive
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [alive] }
                required: [status]
  /ready:
    get:
      tags:
        - health
      summary: Readiness probe (own critical + soft dependencies)
      operationId: getReady
      security: []
      responses:
        '200':
          description: Ready (ok) or serving-degraded (a soft dependency is down)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [ok, degraded] }
                  db:     { type: string, enum: [ok, unavailable] }
                  mqtt:   { type: string, enum: [ok, unavailable] }
                required: [status, db, mqtt]
        '503':
          description: Not ready (a critical dependency — the database — is down)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [unavailable] }
                  db:     { type: string, enum: [unavailable] }
                required: [status, db]

  # Lockers
  /lockers:
    $ref: './paths/lockers.yaml#/lockers'

  /lockers/batch:
    $ref: './paths/lockers.yaml#/lockers_batch'

  /locker/{lockerId}:
    $ref: './paths/lockers.yaml#/lockers_by_id'

  /locker/{lockerId}/state:
    $ref: './paths/lockers.yaml#/lockers_by_id_state'

  /locker/{lockerId}/relays:
    $ref: './paths/relays.yaml#/relays'

  /locker/{lockerId}/relays/{channel}:
    $ref: './paths/relays.yaml#/relays_by_channel'

  # Sensor Types
  /sensor-types:
    $ref: './paths/sensor_types.yaml#/sensor_types'

  /sensor-types/{typeId}:
    $ref: './paths/sensor_types.yaml#/sensor_types_by_id'

  # Sensors
  /locker/{lockerId}/sensors:
    $ref: './paths/sensors.yaml#/sensors'

  /locker/{lockerId}/sensors/{sensorId}:
    $ref: './paths/sensors.yaml#/sensors_by_id'

  # Thresholds
  /locker/{lockerId}/sensors/{sensorId}/thresholds:
    $ref: './paths/thresholds.yaml#/thresholds'

  /locker/{lockerId}/sensors/{sensorId}/thresholds/{thresholdId}:
    $ref: './paths/thresholds.yaml#/thresholds_by_id'

  # Commands
  /locker/{lockerId}/commands:
    $ref: './paths/commands.yaml#/commands'

  /locker/{lockerId}/commands/confirm:
    $ref: './paths/commands.yaml#/commands_confirm'

  /locker/{lockerId}/commands/{commandId}:
    $ref: './paths/commands.yaml#/commands_by_id'

