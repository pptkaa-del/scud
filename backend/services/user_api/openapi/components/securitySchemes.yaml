RemoteUser:
  type: apiKey
  in: header
  name: X-Remote-User
  description: |
    Аутентификация через заголовок X-Remote-User.
    В заголовке передается ID аутентифицированного пользователя.

    Система проверяет:
    1. Наличие заголовка X-Remote-User
    2. Корректность формата (целое число)
    3. Существование пользователя с таким ID в базе данных

    При отсутствии заголовка или некорректных данных возвращается 401 Unauthorized.

    Пример: X-Remote-User: 1
