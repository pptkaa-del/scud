[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scud-emulator"
version = "2.0.0"
description = "SCUD relay-board device emulator — headless MQTT device doubles for development, testing, and load testing"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    # MQTT transport for the headless relay device (scud_relay.mqtt_transport).
    # 0.7.0 matches the previously vendored copy; behaviour preserved. This is
    # the only runtime dependency scud_relay needs (broker creds derive from
    # hashlib, not cryptography).
    "gmqtt>=0.7.0",
]

[project.optional-dependencies]
cli = [
    "typer>=0.14",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov",
]
all = [
    "scud-emulator[cli,dev]",
]

[project.scripts]
scud = "scud_cli.main:app"

[tool.hatch.build.targets.wheel]
packages = [
    "src/scud_cli",
    "src/scud_relay",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
