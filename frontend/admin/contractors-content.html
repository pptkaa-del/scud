<header class="content-header">
    <div class="page-title-section">
        <div class="page-title-main">
            <h2 class="page-title">Подрядчики</h2>
            <p class="page-subtitle">Реестр организаций</p>
        </div>
        <div class="header-actions-row">
            <div class="search-container">
                <div class="search-box">
                    <i class="fas fa-search"></i>
                    <input type="text" id="searchInput" placeholder="Поиск по названию...">
                </div>
            </div>
            <button class="btn-primary btn-with-icon" id="addContractorBtn">
                <i class="fas fa-plus"></i>
                <span>Добавить подрядчика</span>
            </button>
        </div>
    </div>
</header>

<div class="scroll-container">
    <div class="contractors-table">
        <table id="contractorsTable">
            <thead>
                <tr>
                    <th>Название организации</th>
                    <th style="width: 150px;">Действия</th>
                </tr>
            </thead>
            <tbody id="contractorsList"></tbody>
        </table>
        <div id="emptyState" class="empty-message" style="display: none;">
            <i class="fas fa-building"></i>
            <p>Нет добавленных подрядчиков</p>
        </div>
    </div>
    <div id="paginationContainer" class="pagination-container"></div>
</div>

<!-- Модальное окно добавления/редактирования -->
<div class="new-modal-overlay" id="contractorModal">
    <div class="new-modal">
        <div class="new-modal-header">
            <h3><i class="fas fa-building"></i> <span id="modalTitle">Добавить подрядчика</span></h3>
            <button class="new-modal-close" id="closeModalBtn">&times;</button>
        </div>
        <div class="modal-body">
            <form id="contractorForm">
                <div class="form-group">
                    <label for="contractorName">Название организации <span class="required">*</span></label>
                    <input type="text" id="contractorName" class="form-control" maxlength="255" required>
                    <div class="error-message" id="nameError"></div>
                </div>
                <input type="hidden" id="contractorId">
            </form>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" id="cancelModalBtn">Отмена</button>
            <button class="btn-primary" id="saveContractorBtn">Сохранить</button>
        </div>
    </div>
</div>

<!-- Модальное окно подтверждения удаления -->
<div class="new-modal-overlay" id="deleteModal">
    <div class="new-modal">
        <div class="new-modal-header">
            <h3><i class="fas fa-trash-alt"></i> Подтверждение удаления</h3>
            <button class="new-modal-close" id="closeDeleteModalBtn">&times;</button>
        </div>
        <div class="modal-body">
            <p>Вы уверены, что хотите удалить подрядчика <strong id="deleteContractorName"></strong>?</p>
            <p class="text-muted">Это действие нельзя отменить.</p>
        </div>
        <div class="modal-footer">
            <button class="btn-secondary" id="cancelDeleteBtn">Отмена</button>
            <button class="btn-danger" id="confirmDeleteBtn">Удалить</button>
        </div>
    </div>
</div>

<!-- Уведомление -->
<div class="notification" id="notification">
    <i class="fas fa-check-circle notification-icon"></i>
    <span id="notificationMessage">Текст уведомления</span>
</div>
