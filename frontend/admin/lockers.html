<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Шкафы — ТехПанель</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="libs/leaflet/leaflet.css"/>
    <script src="libs/leaflet/leaflet.js"></script>

    <!-- Leaflet Awesome Markers -->
    <link rel="stylesheet" href="libs/leaflet-awesome-markers/leaflet.awesome-markers.css"/>
    <script src="libs/leaflet-awesome-markers/leaflet.awesome-markers.js"></script>

    <!-- Leaflet MarkerCluster -->
    <link rel="stylesheet" href="libs/leaflet-markercluster/MarkerCluster.css"/>
    <link rel="stylesheet" href="libs/leaflet-markercluster/MarkerCluster.Default.css"/>
    <script src="libs/leaflet-markercluster/leaflet.markercluster.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="libs/css/all.min.css">

    <!-- Наши стили -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="lockers.css">

    <style>
        .leaflet-bottom.leaflet-right { display: none !important; }
    </style>
</head>
<body>
    <div class="app-container">
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1><i class="fas fa-tools"></i> ТехПанель</h1>
            </div>

            <nav class="sidebar-nav">
                <a href="open-lockers.html" class="nav-item">
                    <i class="fas fa-door-open"></i>
                    <span>Открытые шкафы</span>
                </a>
                <a href="users.html" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span>Пользователи</span>
                </a>
                <a href="logs.html" class="nav-item">
                    <i class="fas fa-clipboard-list"></i>
                    <span>Системные логи</span>
                </a>
                <a href="security.html" class="nav-item">
                    <i class="fas fa-shield-alt"></i>
                    <span>Безопасность</span>
                </a>
                <a href="lockers.html" class="nav-item active">
                    <i class="fas fa-server"></i>
                    <span>Шкафы управления</span>
                </a>
                <a href="contractors.html" class="nav-item">
                    <i class="fas fa-building"></i>
                    <span>Подрядчики</span>
                </a>
                <a href="reports.html" class="nav-item">
                    <i class="fas fa-chart-bar"></i>
                    <span>Отчёты</span>
                </a>
            </nav>

            <div class="profile-block">
                <div class="profile-main">
                    <div class="profile-avatar">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <div class="profile-info">
                        <span class="profile-name">Иванов Алексей</span>
                        <span class="profile-role">Администратор</span>
                    </div>
                </div>
                <button class="btn-logout" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> Выйти
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <div class="page-title-section">
                    <div class="page-title-main">
                        <h2 class="page-title">Шкафы управления</h2>
                    </div>
                    <div class="header-actions-row">
                        <div class="search-container">
                            <div class="search-box">
                                <i class="fas fa-search"></i>
                                <input type="text" id="cabinetsSearch" placeholder="Поиск по номеру, адресу...">
                                <button class="search-clear" id="clearCabinetsSearch" style="display: none;">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <div class="scroll-container">
                <!-- Фильтры -->
                <div class="filter-bar" id="filterBar">
                    <div class="filter-chips" id="filterChips"></div>
                    <div class="filter-controls">
                        <div class="filter-select-wrapper">
                            <select id="filterConnectivity" class="filter-select">
                                <option value="">Связь: Все</option>
                                <option value="online">Онлайн</option>
                                <option value="offline">Офлайн</option>
                            </select>
                            <i class="fas fa-chevron-down filter-select-arrow"></i>
                        </div>
                        <div class="filter-select-wrapper">
                            <select id="filterDoor" class="filter-select">
                                <option value="">Дверь: Все</option>
                                <option value="closed">Закрыта</option>
                                <option value="open">Открыта</option>
                            </select>
                            <i class="fas fa-chevron-down filter-select-arrow"></i>
                        </div>
                        <div class="filter-select-wrapper">
                            <select id="filterOperationalStatus" class="filter-select">
                                <option value="">Статус: Все</option>
                                <option value="normal">Норма</option>
                                <option value="maintenance">Обслуживание</option>
                                <option value="alarm">Тревога</option>
                            </select>
                            <i class="fas fa-chevron-down filter-select-arrow"></i>
                        </div>
                    </div>
                </div>

                <!-- Карта -->
                <div class="cabinet-map-container">
                    <div class="map-header">
                        <div class="map-title">
                            <i class="fas fa-map-marked-alt"></i>
                            <span>Карта размещения оборудования</span>
                        </div>
                    </div>
                    <div class="folium-map" id="cabinets-map"></div>
                </div>

                <!-- Сетка шкафов -->
                <div class="cabinets-grid" id="cabinetsGrid"></div>

                <div id="paginationContainer" class="pagination-container"></div>

                <!-- Пустое состояние -->
                <div class="empty-state" id="emptyState">
                    <i class="fas fa-server"></i>
                    <h3>Шкафы не найдены</h3>
                    <p>Измените параметры поиска</p>
                </div>
            </div>
            <!-- Модальное окно быстрого просмотра -->
            <div class="new-modal-overlay" id="quickViewModal">
        <div class="new-modal">
            <div class="new-modal-header">
                <h3><i class="fas fa-server"></i> Шкаф</h3>
                <button class="new-modal-close" id="closeQuickView">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="new-modal-body">
                <div class="quick-view-content">
                    <div class="info-item">
                        <div class="info-label">Инвентарный номер</div>
                        <div class="info-value" id="quickViewInventory">—</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Адрес</div>
                        <div class="info-value" id="quickViewAddress">—</div>
                    </div>
                    <div class="info-item">
                        <div class="info-label">Статус связи</div>
                        <div class="info-value" id="quickViewStatus">—</div>
                    </div>
                    <div class="quick-view-actions">
                        <button class="btn-primary" id="goToDetailBtn">
                            <i class="fas fa-arrow-right"></i> Перейти к шкафу
                        </button>
                    </div>
                </div>
            </div>
        </div>
            </div>
        </main>
    </div>

    <script src="lockers.js"></script>
</body>
</html>
