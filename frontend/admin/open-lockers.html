<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Открытые шкафы — ТехПанель</title>
    <link rel="stylesheet" href="libs/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="open-lockers.css">
</head>
<body>
    <div class="app-container">
        <button class="menu-toggle" id="menuToggle"><i class="fas fa-bars"></i></button>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>
        <aside class="sidebar">
            <div class="sidebar-header">
                <h1><i class="fas fa-tools"></i> ТехПанель</h1>
            </div>

            <nav class="sidebar-nav">
                <a href="open-lockers.html" class="nav-item active">
                    <i class="fas fa-door-open"></i>
                    <span>Открытые шкафы</span>
                </a>
                <a href="users.html" class="nav-item">
                    <i class="fas fa-users"></i>
                    <span>Пользователи</span>
                </a>
                <a href="logs.html" class="nav-item">
                    <i class="fas fa-clipboard-list"></i>
                    <span>Системные логи</span>
                </a>
                <a href="security.html" class="nav-item">
                    <i class="fas fa-shield-alt"></i>
                    <span>Безопасность</span>
                </a>
                <a href="lockers.html" class="nav-item">
                    <i class="fas fa-server"></i>
                    <span>Шкафы управления</span>
                </a>
                <a href="contractors.html" class="nav-item">
                    <i class="fas fa-building"></i>
                    <span>Подрядчики</span>
                </a>
                <a href="reports.html" class="nav-item">
                    <i class="fas fa-chart-bar"></i>
                    <span>Отчёты</span>
                </a>
            </nav>

            <div class="profile-block">
                <div class="profile-main">
                    <div class="profile-avatar">
                        <i class="fas fa-user-circle"></i>
                    </div>
                    <div class="profile-info">
                        <span class="profile-name">Иванов Алексей</span>
                        <span class="profile-role">Администратор</span>
                    </div>
                </div>
                <button class="btn-logout" id="logoutBtn">
                    <i class="fas fa-sign-out-alt"></i> Выйти
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <div class="header-title">
                    <h2>Открытые шкафы</h2>
                </div>
            </header>

            <div class="scroll-container">
                <div class="tasks-header">
                    <h3>Шкафы с открытой дверью</h3>
                </div>
                <div class="tasks-grid" id="lockersList">
                    <!-- Карточки загружаются через JS -->
                </div>
            </div>
        </main>
    </div>

    <script src="open-lockers.js"></script>

</html>
