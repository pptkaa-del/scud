# Ротация агрегированного лога syslog-ng (том syslog_ng_logs).
# ~44 МБ/день → daily + rotate 14 + compress держит том под контролем.
# postrotate: syslog-ng-ctl reopen заставляет syslog-ng переоткрыть дескриптор
# на свежесозданный файл (без потери строк в окне cp/truncate).
/var/log/scud/scud-all.log {
    daily
    rotate 14
    compress
    delaycompress
    missingok
    notifempty
    su root root
    postrotate
        syslog-ng-ctl reopen
    endscript
}
