@version: 4.2

options {
    keep-hostname(yes);
    use-dns(no);
};

# Читаем Docker json-file логи всех контейнеров (bind-mount /var/lib/docker/containers).
# Docker пишет каждую строку как {"log":"...","stream":"...","time":"..."}.
# Поле "log" уже содержит JSON, эмитируемый JsonFormatter (LOG_FORMAT=json по умолчанию).
source s_docker_json {
    wildcard-file(
        base-dir("/var/log/containers")
        filename-pattern("*-json.log")
        recursive(yes)
        flags(no-parse)
        follow-freq(1)
    );
};

# Разворачиваем внешнюю Docker-обёртку: достаём поле .docker.log и т.д.
parser p_docker_outer {
    json-parser(prefix(".docker."));
};

# Отбрасываем строки, чей .docker.log не начинается с '{' —
# LOG_FORMAT=text сервисы дают plain-text, а не JSON.
filter f_json_only {
    match("^\\{" value(".docker.log"));
};

# Разбираем ВНУТРЕННИЙ JSON приложения (.docker.log) в префикс .app.*, чтобы
# получить поле .app.service (JsonFormatter из shared.observability кладёт его в
# каждую строку). Имя контейнера в самой Docker-строке отсутствует, поэтому
# allowlist строим именно по этому полю приложения.
parser p_app_inner {
    json-parser(template("${.docker.log}") prefix(".app."));
};

# Allowlist: пропускаем только логи 7 backend-сервисов СКУД. Любой инфра-контейнер
# с JSON-логами (например postgres c log_destination=jsonlog) будет отброшен, а не
# попадёт в scud-all.log без поля service.
filter f_scud_services {
    match("^(user_api|locker_api|history_api|auth_api|acm|notification_api|reports_api)$"
          value(".app.service"));
};

# Пишем в файл под именованным томом syslog_ng_logs.
destination d_file {
    file("/var/log/scud/scud-all.log"
         template("${.docker.log}\n")
         create-dirs(yes));
};

log {
    source(s_docker_json);
    parser(p_docker_outer);
    filter(f_json_only);
    parser(p_app_inner);
    filter(f_scud_services);
    destination(d_file);
};
