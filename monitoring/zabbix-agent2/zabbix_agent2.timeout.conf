# Глобальный таймаут проверок zabbix-agent2 (drop-in: /etc/zabbix/zabbix_agent2.d/).
# Холодный psql-коннект на каждый пассивный scud.dbprobe[*]-элемент занимает ~10 с,
# что превышает дефолтные 3 с агента и приводит к "Timeout occurred while gathering
# data". 30 — максимум Zabbix 7.0 (диапазон 1-30). Сервер дополнительно ограничен
# item-level timeout: 30s на dbprobe-элементах в template-scud-infra.yaml.
Timeout=30
