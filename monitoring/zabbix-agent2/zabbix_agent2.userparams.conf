# SCUD infra probes for zabbix-agent2 (drop-in: /etc/zabbix/zabbix_agent2.d/).
# ONE parameterised UserParameter covering both PgBouncer and PostgreSQL.
#   scud.dbprobe[<source>,<host>,<metric>]
#     source = pgb | pg
#     host   = pgbouncer_<svc> (pgb) | postgres_<svc> (pg)
#     metric = a fixed token handled by dbprobe.sh's case dispatcher:
#              pgb -> cl_waiting | sv_active | maxwait | avg_query_time
#              pg  -> numbackends | max_connections | deadlocks |
#                     xact_rollback | longest_txn_seconds |
#                     history_partition_bytes, history_orphan_media (history db only)
# dbprobe.sh prints exactly one scalar, or nothing + non-zero exit
# (-> ZBX_NOTSUPPORTED). All SQL is inlined in dbprobe.sh — no queries/ files.
UserParameter=scud.dbprobe[*],/usr/local/bin/dbprobe.sh "$1" "$2" "$3"

# Статус последнего цикла резервного копирования. backup.sh пишет
# /backups/last_run_status: "OK <iso-ts>" или "FAIL <dbs> <iso-ts>".
# Том backup_data смонтирован в /backups:ro (см. docker-compose.yaml).
# При отсутствии файла возвращает sentinel UNKNOWN для nodata-триггера.
UserParameter=scud.backup.status,if [ -f /backups/last_run_status ]; then cat /backups/last_run_status; else echo "UNKNOWN no-status-file"; fi
