Listen 8080
<VirtualHost *:8080>
    DocumentRoot /usr/share/zabbix
    DirectoryIndex index.php

    <Directory /usr/share/zabbix>
        Require all granted
        AllowOverride None
    </Directory>

    <FilesMatch \.php$>
        SetHandler "proxy:unix:/run/php/php8.2-fpm.sock|fcgi://localhost"
    </FilesMatch>
</VirtualHost>
