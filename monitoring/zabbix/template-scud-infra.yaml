    # =========================================================================
    # PostgreSQL x6 — explicit ZABBIX_PASSIVE items per instance through the
    # scud.dbprobe[pg,postgres_<svc>,<metric>] UserParameter. Each returns ONE
    # scalar. max_connections is polled at 5m (static); the rest at 30-60s.
    # history_partition_bytes is added ONLY on postgres_history.
    # =========================================================================
    - uuid: de49123ef6a54a3e82c92f023f1825db
      template: "scud-infra-postgres"
      name: "SCUD Infra Postgres"
      description: "PostgreSQL pg_stat_* scalars via the scud.dbprobe UserParameter (6 instances, explicit)."
      groups:
        - name: "Templates/SCUD/Infra"
      macros:
        - macro: "{$OUTBOX.PENDING.HIGH}"
          value: "5000"
          description: "Outbox pending backlog (sustained 10m) above which the backlog-building trigger fires."
        - macro: "{$OUTBOX.OLDEST.MAX.S}"
          value: "600"
          description: "Max age (s) of the oldest undelivered outbox event before delivery is considered stalled."
        - macro: "{$OUTBOX.BYTES.HIGH}"
          value: "268435456"
          description: "Outbox pending payload bytes (256 MiB) above which a dispatcher memory-pressure (OOM precursor) trigger fires."
      items:
        # ---- postgres_user ----
        - uuid: 4a343d1faf0348ea931429beb3fb976c
          name: "Postgres user: backends in use"
          type: ZABBIX_PASSIVE
          key: "scud.dbprobe[pg,postgres_user,numbackends]"
          timeout: 30s
          delay: 30s
          value_type: FLOAT
        - uuid: db1ccb45354f496391985f45cacb9c34
          name: "Postgres user: max_connections"
          type: ZABBIX_PASSIVE
          key: "scud.dbprobe[pg,postgres_user,max_connections]"
          timeout: 30s
          delay: 5m
          value_type: FLOAT
        - uuid: 725d1463bd794377954ca8e39414a5df
          name: "Postgres user: deadlocks"
          type: ZABBIX_PASSIVE
          key: "scud.dbprobe[pg,postgres_user,deadlocks]"
          timeout: 30s
          delay: 60s
          value_type: FLOAT
        - uuid: d94e5c3119344277bcd5a34933cfe439
          name: "Postgres user: xact rollbacks"
          type: ZABBIX_PASSIVE
          key: "scud.dbprobe[pg,postgres_user,xact_rollback]"
          timeout: 30s
          delay: 60s
          value_type: FLOAT
        - uuid: fae77de759074e1aaec78e4979e836e0
          name: "Postgres user: longest running txn"
          type: ZABBIX_PASSIVE
          key: "scud.dbprobe[pg,postgres_user,longest_txn_seconds]"
          timeout: 30s
          delay: 60s
          value_type: FLOAT
          units: s
        # ---- postgres_locker ----
        - uuid: f8aca7033e1f41e4b49c54f511d2fabb
          name: "Postgres locker: backends in use"
          type: ZABBIX_PASSIVE
          key: "scud.dbprobe[pg,postgres_locker,numbackends]"
          timeout: 30s
          delay: 30s
          value_type: FLOAT
        - uuid: b22366031efe4f509f36a7eda4947f0d
          name: "Postgres locker: max_connections"
          type: ZABBIX_PASSIVE
          key: "scud.dbprobe[pg,postgres_locker,max_connections]"
          timeout: 30s
          delay: 5m
          value_type: FLOAT
        - uuid: 436255830aa549f3b15e80738aa4fb5f
          name: "Postgres locker: deadlocks"
          type: ZABBIX_PASSIVE
          key: "scud.dbprobe[pg,postgres_locker,deadlocks]"
          timeout: 30s
          delay: 60s
          value_type: FLOAT
        - uuid: 1e85af0619634a6bbe8a5e16ca3dbe5e
          name: "Postgres locker: xact rollbacks"
          type: ZABBIX_PASSIVE
          key: "scud.dbprobe[pg,postgres_locker,xact_rollback]"
          timeout: 30s
          delay: 60s
          value_type: FLOAT
        - uuid: f2da1e176d1c4256b9fb3ad22bbea3b1
          name: "Postgres locker: longest running txn"
          type: ZABBIX_PASSIVE
          key: "scud.dbprobe[pg,postgres_locker,longest_txn_seconds]"
          timeout: 30s
          delay: 60s
          value_type: FLOAT
          units: s
        # ---- outbox (outbound_history_events → history_api), postgres_locker only ----
        # Очередь доставки событий в history_api. Бэклог/возраст/байты делают
        # видимым ровно тот класс отказа, что задушил dispatcher (WS-media-хвост):
        # outbox_pending_bytes — предвестник OOM, outbox_oldest_age_s — «доставка
        # встала», outbox_deadletter — события, сданные в dead-letter.
        - uuid: e69f8d67e67347789f83a79e8d2998e1
          name: "Outbox: pending events"
          type: ZABBIX_PASSIVE
          key: "scud.dbprobe[pg,postgres_locker,outbox_pending]"
          timeout: 30s
          delay: 60s
          value_type: FLOAT
        - uuid: 492ca3102c3b4b0a8ac9f9e8635f8611
          name: "Outbox: oldest pending age"
          type: ZABBIX_PASSIVE
          key: "scud.dbprobe[pg,postgres_locker,outbox_oldest_age_s]"
          timeout: 30s
          delay: 60s
          value_type: FLOAT
          units: s
        - uuid: e2b39df5cf59416196c908ff89e9bc60
          name: "Outbox: pending payload bytes"
          type: ZABBIX_PASSIVE
          key: "scud.dbprobe[pg,postgres_locker,outbox_pending_bytes]"
          timeout: 30s
          delay: 60s
          value_type: FLOAT
          units: B
        - uuid: 4e9ae94f9de942e8a177bb4dca1c69c8
          name: "Outbox: retrying events"
          type: ZABBIX_PASSIVE
          key: "scud.dbprobe[pg,postgres_locker,outbox_retrying]"
          timeout: 30s
          delay: 60s
          value_type: FLOAT
        - uuid: 695d91d9b71d466dacfeb4ec2cf7ba40
          name: "Outbox: dead-lettered events"
          type: ZABBIX_PASSIVE
          key: "scud.dbprobe[pg,postgres_locker,outbox_deadletter]"
          timeout: 30s
          delay: 60s
          value_type: FLOAT
        # ---- postgres_history ----
        - uuid: b4d57011307046bb8c2acf960174c6cb
          name: "Postgres history: backends in use"
          type: ZABBIX_PASSIVE
          key: "scud.dbprobe[pg,postgres_history,numbackends]"
