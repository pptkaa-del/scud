          key: "scud.dbprobe[pg,postgres_history,history_partition_bytes]"
          timeout: 30s
          delay: 5m
          value_type: FLOAT
          units: B
          description: "Total bytes of the scud_history monthly partitions (telemetry + security_events); only present on postgres_history."
        - uuid: 6970564732ab485894d3830ccb8a95d2
          name: "Postgres history: relay photo frames without event"
          type: ZABBIX_PASSIVE
          key: "scud.dbprobe[pg,postgres_history,history_orphan_media]"
          timeout: 30s
          delay: 60s
          value_type: FLOAT
          description: "locker_media rows with security_event_uid but no linked security event for over 10 minutes (relay photo frames whose intrusion event never arrived); only present on postgres_history."
