    # ---- Outbox (outbound_history_events → history_api) resilience ----
    # Делают видимым класс отказа, задушивший dispatcher (WS-media-хвост):
    # бэклог растёт, доставка встала, очередь пухнет по байтам (OOM-предвестник),
    # события сданы в dead-letter. Все четыре — на scud-infra-postgres
    # (outbox-таблица в scud_lockers, dbprobe[pg,postgres_locker,...]).
    - uuid: 3353d5b54e874a219e448d6579880a5b
      name: "Outbox backlog building (>{$OUTBOX.PENDING.HIGH} pending for 10m)"
      priority: AVERAGE
      expression: "min(/scud-infra-postgres/scud.dbprobe[pg,postgres_locker,outbox_pending],10m)>{$OUTBOX.PENDING.HIGH}"
      description: "Undelivered history events are piling up faster than the dispatcher drains them — history_api slow/down or throughput too low."
    - uuid: c5aa32b98d4943d29d49273f2138f52f
      name: "Outbox delivery stalled (oldest pending >{$OUTBOX.OLDEST.MAX.S}s for 5m)"
      priority: HIGH
      expression: "min(/scud-infra-postgres/scud.dbprobe[pg,postgres_locker,outbox_oldest_age_s],5m)>{$OUTBOX.OLDEST.MAX.S}"
      description: "The oldest undelivered event is older than the SLO — telemetry/media are not reaching history_api; the dispatcher is stuck or blocked."
    - uuid: 3cfa3ca4693447aaba255c8bf4305a44
      name: "Outbox pending bytes high (>{$OUTBOX.BYTES.HIGH} for 5m)"
      priority: HIGH
      expression: "min(/scud-infra-postgres/scud.dbprobe[pg,postgres_locker,outbox_pending_bytes],5m)>{$OUTBOX.BYTES.HIGH}"
      description: "Pending payload bytes (mostly base64 media) are large — the dispatcher batch can load this into memory and OOM. Precursor to the failure that froze delivery."
    - uuid: 1f647c47b4674f95a37c66dc1b1f8532
      name: "Outbox dead-letter events present"
      priority: AVERAGE
      expression: "last(/scud-infra-postgres/scud.dbprobe[pg,postgres_locker,outbox_deadletter])>0"
      description: "Events were parked in dead-letter after exhausting delivery attempts — poison events or a long history_api outage. Needs manual review/replay."
    - uuid: 675af89767b34063943acbeeceea153a
      name: "Relay photo frames without intrusion event for 30m"
      priority: WARNING
      expression: "min(/scud-infra-postgres/scud.dbprobe[pg,postgres_history,history_orphan_media],30m)>0"
      description: "Relay photo frames reached history_api but their intrusion event did not — usually the security event is dead-lettered in the locker outbox. The frames stay invisible on the incidents page until the event is delivered."

