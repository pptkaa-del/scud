          name: "Postgres reports: longest running txn"
          type: ZABBIX_PASSIVE
          key: "scud.dbprobe[pg,postgres_reports,longest_txn_seconds]"
          timeout: 30s
          delay: 60s
          value_type: FLOAT
          units: s

    # =========================================================================
    # Gateway — Apache reverse proxy. Two layers of visibility:
    #   * net.tcp.service[http,apache_gateway,80] — coarse up/down on the public
    #     port (agent-side passive check), kept as-is.
    #   * mod_status — детальная статистика воркеров/throughput. zabbix_server
    #     (в backend_net) скрейпит внутренний http://apache_gateway:81/
    #     server-status?auto HTTP-агент-итемом (master), а dependent-итемы
    #     вытаскивают поля REGEX/JAVASCRIPT-препроцессингом. Порт 81 НЕ
    #     публикуется наружу (см. gateway/status.conf) — публичный :80 статистику
    #     не отдаёт. MPM gateway = prefork: один процесс на соединение, поэтому
    #     BusyWorkers у предела MaxRequestWorkers (slots_total, закреплён = 150 в
    #     gateway/mpm.conf) = потолок одновременных соединений, включая
    #     WebSocket-туннели.
    #
    # ОГРАНИЧЕНИЕ: mod_status НЕ видит HTTP-коды ответов, поэтому edge-ошибки
    # шлюза (502/503/504 от недоступного backend или исчерпания пула воркеров)
    # здесь невидимы. Per-service 5xx считается в scud_http_requests_5xx
    # (template-scud-services.yaml). Отдельный gateway-edge 5xx-счётчик из
    # access-лога (через syslog-ng/agent2) — отдельная задача (follow-up).
    # =========================================================================
    - uuid: 5769daa8a44d4fb981451a92365651d5
      template: "scud-infra-gateway"
      name: "SCUD Infra Gateway"
      description: "Apache reverse-proxy: reachability (:80) + mod_status worker/throughput stats (internal :81)."
      groups:
        - name: "Templates/SCUD/Infra"
      macros:
        - macro: "{$GATEWAY.WORKERS.HIGH.PCT}"
          value: "85"
          description: "Worker-pool utilisation %% above which the saturation trigger fires."
      items:
        - uuid: f58b8772dbe74ad0aaeb59d3fc182e4f
          name: "Gateway: HTTP service reachable"
          type: ZABBIX_PASSIVE
          key: "net.tcp.service[http,apache_gateway,80]"
          delay: 30s
          value_type: UNSIGNED
          description: "1 if the Apache gateway answers HTTP on :80, else 0."

        # ---- mod_status master: raw ?auto page (internal port 81) -------------
        - uuid: d76c85098aa14d56a76983df8ec72e8c
          name: "Gateway: server-status raw"
          type: HTTP_AGENT
          key: "scud.gateway.status.raw"
          delay: 30s
          history: "0"
          trends: "0"
          value_type: TEXT
          url: "http://apache_gateway:81/server-status?auto"
          status_codes: "200"
          timeout: 10s
          description: "Master item: machine-readable mod_status (?auto) from the internal-only :81 endpoint. Dependent items parse individual fields."

        # ---- Workers --------------------------------------------------------
        - uuid: b9dac50e8d0248309dcaa0e53c804e5f
          name: "Gateway: busy workers"
          type: DEPENDENT
          key: "scud.gateway.busy_workers"
          value_type: UNSIGNED
          master_item:
            key: "scud.gateway.status.raw"
          description: "Processes actively handling a connection (prefork: ≈ concurrent connections, incl. WS tunnels). Floor ≈1: the mod_status scrape itself occupies one worker, so an otherwise-idle gateway never reads 0."
          preprocessing:
            - type: REGEX
              parameters:
                - "BusyWorkers: ([0-9]+)"
                - '\1'
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
        - uuid: c00bff9ac7dc4a678440e8edaec736b2
          name: "Gateway: idle workers"
          type: DEPENDENT
          key: "scud.gateway.idle_workers"
          value_type: UNSIGNED
          master_item:
            key: "scud.gateway.status.raw"
          preprocessing:
            - type: REGEX
              parameters:
                - "IdleWorkers: ([0-9]+)"
                - '\1'
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
        - uuid: 8d319b634b954e36955064225f5ff6e3
          name: "Gateway: graceful workers"
          type: DEPENDENT
          key: "scud.gateway.graceful_workers"
          value_type: UNSIGNED
          master_item:
            key: "scud.gateway.status.raw"
          description: "Workers finishing in-flight requests during a graceful restart."
          preprocessing:
            - type: REGEX
              parameters:
                - "GracefulWorkers: ([0-9]+)"
                - '\1'
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
        - uuid: 07658fb00be746cf856b8c6354344fb2
          name: "Gateway: worker slots total (MaxRequestWorkers)"
          type: DEPENDENT
          key: "scud.gateway.slots_total"
          value_type: UNSIGNED
          master_item:
            key: "scud.gateway.status.raw"
          description: "Scoreboard length = hard ceiling of concurrent prefork processes. Pinned to MaxRequestWorkers (150) via gateway/mpm.conf so it == the real connection ceiling."
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - "var m=value.match(/Scoreboard: (\\S+)/);return m?m[1].length:0;"
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
        - uuid: efd5c4e5ba1345ff91c325da64bc1ceb
          name: "Gateway: worker utilisation %"
          type: DEPENDENT
          key: "scud.gateway.worker_util_pct"
          value_type: FLOAT
          units: "%"
          master_item:
            key: "scud.gateway.status.raw"
          description: "BusyWorkers / slots_total * 100. 100%% = MaxRequestWorkers reached → new connections queue/refuse."
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - "var b=value.match(/BusyWorkers: (\\d+)/),s=value.match(/Scoreboard: (\\S+)/);if(!b||!s)return 0;var n=s[1].length;return n>0?Math.round(b[1]/n*10000)/100:0;"
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"

        # ---- Throughput / latency ------------------------------------------
        - uuid: 7a18086814f845f98b241a47aa4dc733
          name: "Gateway: requests/sec (lifetime avg)"
          type: DEPENDENT
          key: "scud.gateway.req_per_sec"
          value_type: FLOAT
          master_item:
            key: "scud.gateway.status.raw"
          description: "Apache ReqPerSec — Total Accesses / Uptime (lifetime average, not live rate)."
          preprocessing:
            - type: REGEX
              parameters:
                - "ReqPerSec: ([0-9.]+(?:[eE][+-]?[0-9]+)?)"
                - '\1'
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
        - uuid: 141ccf77d46c4d9387b3cc585efb7ae2
          name: "Gateway: requests/sec (live)"
          type: DEPENDENT
          key: "scud.gateway.req_rate"
          value_type: FLOAT
          master_item:
            key: "scud.gateway.status.raw"
          description: "Per-second delta of Total Accesses — the live request rate."
          preprocessing:
            - type: REGEX
              parameters:
                - "Total Accesses: ([0-9]+)"
                - '\1'
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
            - type: CHANGE_PER_SECOND
              parameters:
                - ""
        - uuid: f15d4c3ad2f340f6a5465a3980ca7e2e
          name: "Gateway: bytes/sec"
          type: DEPENDENT
          key: "scud.gateway.bytes_per_sec"
          value_type: FLOAT
          units: Bps
          master_item:
            key: "scud.gateway.status.raw"
          preprocessing:
            - type: REGEX
              parameters:
                - "BytesPerSec: ([0-9.]+(?:[eE][+-]?[0-9]+)?)"
                - '\1'
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
        - uuid: 2e8e1eb270ab4cbea2c3e9b030473399
          name: "Gateway: bytes/request"
          type: DEPENDENT
          key: "scud.gateway.bytes_per_req"
          value_type: FLOAT
          units: B
          master_item:
            key: "scud.gateway.status.raw"
          preprocessing:
            - type: REGEX
              parameters:
                - "BytesPerReq: ([0-9.]+(?:[eE][+-]?[0-9]+)?)"
                - '\1'
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
        - uuid: 2f91813d8c5e42959cfcecd7e92e49a6
          name: "Gateway: avg request duration (lifetime, incl. WS tunnels)"
          type: DEPENDENT
          key: "scud.gateway.duration_per_req"
          value_type: FLOAT
          units: ms
          master_item:
            key: "scud.gateway.status.raw"
          description: "Apache DurationPerReq — LIFETIME mean over Total Accesses. On a WS-carrying proxy it is inflated by closed 3600 s device tunnels, so it is NOT live API latency — use the per-service scud_http_request_duration_seconds for that."
          preprocessing:
            - type: REGEX
              parameters:
                - "DurationPerReq: ([0-9.]+(?:[eE][+-]?[0-9]+)?)"
                - '\1'
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
        - uuid: 9b2dd0e48287446bb379502da3c0f1a0
          name: "Gateway: total accesses"
          type: DEPENDENT
          key: "scud.gateway.total_accesses"
          value_type: UNSIGNED
          master_item:
            key: "scud.gateway.status.raw"
          description: "Cumulative requests served since (graceful) start."
          preprocessing:
            - type: REGEX
              parameters:
                - "Total Accesses: ([0-9]+)"
                - '\1'
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
        - uuid: e016c771479449b5b0a71a4a89fad1fa
          name: "Gateway: total kBytes"
          type: DEPENDENT
          key: "scud.gateway.total_kbytes"
          value_type: UNSIGNED
          units: B
          master_item:
            key: "scud.gateway.status.raw"
          description: "Cumulative kBytes served (units B with kB multiplier)."
          preprocessing:
            - type: REGEX
              parameters:
                - "Total kBytes: ([0-9]+)"
                - '\1'
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
            - type: MULTIPLIER
              parameters:
                - "1024"

        # ---- Process / host load -------------------------------------------
        - uuid: 30f014e4a6514bf8be0a8edff8e90a7b
          name: "Gateway: CPU load"
          type: DEPENDENT
          key: "scud.gateway.cpu_load"
          value_type: FLOAT
          units: "%"
          master_item:
            key: "scud.gateway.status.raw"
          description: "Apache CPULoad — % CPU used by Apache workers (own accounting, not host)."
          preprocessing:
            - type: REGEX
              parameters:
                - "CPULoad: ([0-9.]+(?:[eE][+-]?[0-9]+)?)"
                - '\1'
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
        - uuid: 92602988aa494c8dae2cb68957c06c2e
          name: "Gateway: uptime"
          type: DEPENDENT
          key: "scud.gateway.uptime"
          value_type: UNSIGNED
          units: uptime
          master_item:
            key: "scud.gateway.status.raw"
          description: "Seconds since the last (graceful) restart — a drop signals a restart/crash."
          preprocessing:
            # (?m)^ anchors to the line starting with "Uptime:" so it does NOT
            # match "ServerUptime:" / "ServerUptimeSeconds:". A literal \n in the
            # pattern must be avoided — Zabbix stores preprocessing params as a
            # newline-separated string, so an embedded newline splits into
            # phantom extra params and configuration.import rejects it.
            - type: REGEX
              parameters:
                - "(?m)^Uptime: ([0-9]+)"
                - '\1'
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
        - uuid: 6995e660afe342598cfe1137813a1ae3
          name: "Gateway: host load average (1m)"
          type: DEPENDENT
          key: "scud.gateway.load1"
          value_type: FLOAT
          master_item:
            key: "scud.gateway.status.raw"
          description: "Load1 from mod_status — 1-minute system load average as seen by the gateway."
          preprocessing:
            - type: REGEX
              parameters:
                - "Load1: ([0-9.]+(?:[eE][+-]?[0-9]+)?)"
                - '\1'
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"

        # ---- Scoreboard breakdown (count of each worker state) --------------
        # PARTIAL breakdown — the operationally useful states only. Startup/
        # graceful states (S/D/L/G/I) are omitted, so sb_* do NOT sum to
        # slots_total; use worker_util_pct / busy_workers for saturation, not a
        # sum of these.
        - uuid: 74e524c325e54523b5d655de4b763b2a
          name: "Gateway: workers sending reply (W)"
          type: DEPENDENT
          key: "scud.gateway.sb_sending"
          value_type: UNSIGNED
          master_item:
            key: "scud.gateway.status.raw"
          description: "Scoreboard 'W' — workers actively sending a reply / proxying (incl. live WS tunnels)."
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - "var m=value.match(/Scoreboard: (\\S+)/);return m?(m[1].split('W').length-1):0;"
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
        - uuid: e27c6dfb23874185a95a78add539f153
          name: "Gateway: workers waiting (_)"
          type: DEPENDENT
          key: "scud.gateway.sb_waiting"
          value_type: UNSIGNED
          master_item:
            key: "scud.gateway.status.raw"
          description: "Scoreboard '_' — idle workers waiting for a connection."
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - "var m=value.match(/Scoreboard: (\\S+)/);return m?(m[1].split('_').length-1):0;"
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
        - uuid: f4becfc94add4c4684f904c818af8ae3
          name: "Gateway: workers reading request (R)"
          type: DEPENDENT
          key: "scud.gateway.sb_reading"
          value_type: UNSIGNED
          master_item:
            key: "scud.gateway.status.raw"
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - "var m=value.match(/Scoreboard: (\\S+)/);return m?(m[1].split('R').length-1):0;"
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
        - uuid: dca496c0a6454690946c5ea2fcb0a1e4
          name: "Gateway: workers keepalive (K)"
          type: DEPENDENT
          key: "scud.gateway.sb_keepalive"
          value_type: UNSIGNED
          master_item:
            key: "scud.gateway.status.raw"
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - "var m=value.match(/Scoreboard: (\\S+)/);return m?(m[1].split('K').length-1):0;"
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
        - uuid: 0c8d0c18b4de4a90a0bd4dcefd9cab5f
          name: "Gateway: workers closing (C)"
          type: DEPENDENT
          key: "scud.gateway.sb_closing"
          value_type: UNSIGNED
          master_item:
            key: "scud.gateway.status.raw"
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - "var m=value.match(/Scoreboard: (\\S+)/);return m?(m[1].split('C').length-1):0;"
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
        - uuid: b88e4338a6a64fc18370e64276c2a3dd
          name: "Gateway: open slots (.)"
          type: DEPENDENT
          key: "scud.gateway.sb_open"
          value_type: UNSIGNED
          master_item:
            key: "scud.gateway.status.raw"
          description: "Scoreboard '.' — unused worker slots; headroom before MaxRequestWorkers."
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - "var m=value.match(/Scoreboard: (\\S+)/);return m?(m[1].split('.').length-1):0;"
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"

    # =========================================================================
    # Backup — статус последнего цикла pg_dump, записываемый backup.sh.
    # Агент читает /backups/last_run_status (том backup_data, :ro) через
    # UserParameter scud.backup.status (zabbix_agent2.userparams.conf).
    # ZABBIX_ACTIVE: агент сам отправляет значение каждый час; если данных
    # нет >25 ч (90000 с) — сработает триггер "backup не выполнялся".
    # =========================================================================
    - uuid: 99162cd034944a5991c2248d055804e0
      template: "scud-infra-backup"
      name: "SCUD Infra Backup"
      description: "Мониторинг последнего цикла резервного копирования через UserParameter scud.backup.status."
      groups:
        - name: "Templates/SCUD/Infra"
      items:
        - uuid: 32440b89f2934a87a8ecd9dc337655ef
          name: "Backup: статус последнего цикла"
          type: ZABBIX_ACTIVE
          key: "scud.backup.status"
          delay: 3600s
          history: 30d
          value_type: TEXT
          description: "OK <iso-ts> при успехе; FAIL <dbs> <iso-ts> при сбоях; UNKNOWN no-status-file если файл ещё не создан."

    # =========================================================================
    # Host — OS-level resources of the scud-dev VM. The zabbix_agent2 container
    # runs with pid:host and the host root mounted at /hostfs:ro, so the built-in
    # system.*/vm.*/vfs.fs.* keys read the HOST (not the container).
    # =========================================================================
    - uuid: 6926e10bf09b4797926f9f2a5598506a
      template: "scud-infra-host"
      name: "SCUD Infra Host"
      description: "OS-уровень ВМ scud-dev: CPU, load, память, диск, uptime (built-in agent2 keys, pid:host + /hostfs)."
      groups:
        - name: "Templates/SCUD/Infra"
      items:
        - uuid: 3e1d84d2beb746a7976c3bd87d5a7dc4
          name: "Host: CPU utilisation"
          type: ZABBIX_PASSIVE
          key: "system.cpu.util"
          delay: 60s
          value_type: FLOAT
          units: "%"
        - uuid: 2b03a2b22aa8467d9f1647adaa878d90
          name: "Host: CPU load average (1m)"
          type: ZABBIX_PASSIVE
          key: "system.cpu.load[all,avg1]"
          delay: 60s
          value_type: FLOAT
        - uuid: d5c096e693b444c7a8a1bc00da9f4cdc
          name: "Host: memory total"
          type: ZABBIX_PASSIVE
          key: "vm.memory.size[total]"
          delay: 300s
          value_type: UNSIGNED
          units: B
        - uuid: fb05b10ab9504ea88cc6d861f2199f38
          name: "Host: memory available"
          type: ZABBIX_PASSIVE
          key: "vm.memory.size[available]"
          delay: 60s
          value_type: UNSIGNED
          units: B
        - uuid: 6793886e3d8748ccb2bd6b6595e1f022
          name: "Host: memory available %"
          type: ZABBIX_PASSIVE
          key: "vm.memory.size[pavailable]"
          delay: 60s
          value_type: FLOAT
          units: "%"
        - uuid: 4bec429c2a694683b718d6bd3995145b
          name: "Host: disk total (/)"
          type: ZABBIX_PASSIVE
          key: "vfs.fs.size[/hostfs,total]"
          delay: 300s
          value_type: UNSIGNED
          units: B
        - uuid: a622d5eb76484a649feb3da55b4def41
          name: "Host: disk used (/)"
          type: ZABBIX_PASSIVE
          key: "vfs.fs.size[/hostfs,used]"
          delay: 300s
          value_type: UNSIGNED
          units: B
        - uuid: 9806811f17ba4091bf3fd21fa27a254a
          name: "Host: disk used % (/)"
          type: ZABBIX_PASSIVE
          key: "vfs.fs.size[/hostfs,pused]"
          delay: 300s
          value_type: FLOAT
          units: "%"
        - uuid: 40068a3c6b8c4274bcf63f4e020a3bca
          name: "Host: uptime"
          type: ZABBIX_PASSIVE
          key: "system.uptime"
          delay: 300s
          value_type: UNSIGNED
          units: uptime

  # ===========================================================================
  # Top-level triggers (Zabbix 7.0 YAML: triggers live under zabbix_export,
  # NOT under individual templates, and NOT as trigger_prototypes — R4).
  # ===========================================================================
  triggers:
    # ---- Host (OS resources of the scud-dev VM) ----
    - uuid: 5cd9ba9f029c4c5aa7212a967585f41f
      name: "Host CPU utilisation high (>90% sustained 5m)"
      priority: HIGH
      expression: "min(/scud-infra-host/system.cpu.util,5m)>90"
    - uuid: aef45d01bdbc4147b3b84a14d10e05ea
      name: "Host disk space low (root >90% used)"
      priority: HIGH
      expression: "last(/scud-infra-host/vfs.fs.size[/hostfs,pused])>90"
    - uuid: 025e3c2f600f49dc998b6737ee065589
      name: "Host memory low (<10% available)"
      priority: AVERAGE
      expression: "max(/scud-infra-host/vm.memory.size[pavailable],5m)<10"

    # ---- Redis (fallback: scud_redis_up reachability only) ----
    - uuid: 5d9b4b0643f147559f0a31f45cd2b8e3
      name: "Redis unreachable (scud_redis_up=0)"
      priority: HIGH
      expression: "last(/scud-infra-redis/scud.infra.redis.up)<1"

    # ---- Gateway ----
    - uuid: f17608e68f9a40a69a5f73635e09ef32
      name: "Gateway down (Apache HTTP :80 unreachable 2m)"
      priority: HIGH
      expression: "max(/scud-infra-gateway/net.tcp.service[http,apache_gateway,80],2m)=0"
    - uuid: 5231ce0fbe2d459a9954a755ba9b2cdf
      name: "Gateway worker pool saturating (>{$GATEWAY.WORKERS.HIGH.PCT}% for 5m)"
      priority: AVERAGE
      expression: "min(/scud-infra-gateway/scud.gateway.worker_util_pct,5m)>{$GATEWAY.WORKERS.HIGH.PCT}"
      description: "Busy prefork workers near MaxRequestWorkers. New connections — especially WebSocket tunnels, one worker each — will start queuing or being refused."
    - uuid: a137ec548d2d42bbaf8ca60698958f82
      name: "Gateway worker pool exhausted (>95% for 2m)"
      priority: HIGH
      expression: "min(/scud-infra-gateway/scud.gateway.worker_util_pct,2m)>95"
      description: "Almost all worker slots busy — the gateway is at its concurrency ceiling and rejecting/queueing new connections."
    - uuid: 4a052fb5877a4e5ab4bc6b73f09e9878
      name: "Gateway server-status scrape failing (no data 5m)"
      priority: AVERAGE
      # nodata() targets a history-bearing dependent, NOT the master
      # scud.gateway.status.raw (history:"0" — nodata on a no-history item is
      # unreliable). busy_workers updates on every successful scrape.
      expression: "nodata(/scud-infra-gateway/scud.gateway.busy_workers,5m)=1"
      description: "mod_status (:81) not answering — worker/throughput metrics are stale even if the public :80 is still up."

    # ---- PgBouncer: clients waiting for a server connection (sustained 2m) ----
    - uuid: 5d147ab8d2054116bebed799f0c49dc1
      name: "PgBouncer user clients waiting for a server connection (sustained 2m)"
      priority: AVERAGE
      expression: "min(/scud-infra-pgbouncer/scud.dbprobe[pgb,pgbouncer_user,cl_waiting],2m)>0"
    - uuid: 0dd8603621b64003abea7f67b6c3e7b8
