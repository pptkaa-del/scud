zabbix_export:
  version: "7.0"
  template_groups:
    - uuid: 02cbee81499c40b39e2bcb6b91427aca
      name: "Templates/SCUD"
    - uuid: 645d206fc63a4ee89cff059ac31bca3e
      name: "Templates/SCUD/Infra"

  templates:

    # =========================================================================
    # Redis — FALLBACK (REDIS_PLUGIN_ABSENT in Astra 7.0.10 build).
    # The agent2 redis plugin is absent in this certified build; native
    # redis.info[...] items are unavailable. Redis is monitored via a single
    # reachability gauge scud_redis_up (0=down/1=up) emitted by shared.metrics
    # on each service's /metrics endpoint. We scrape acm:8004/metrics (HTTP_AGENT
    # master) and derive scud.infra.redis.up via PROMETHEUS_PATTERN preprocessing.
    # Detailed redis internals (memory, clients, ops) are unavailable under this
    # fallback — the honest consequence of the absent plugin.
    # =========================================================================
    - uuid: d1fec7b2ea9a4d83a04b19c26a9f78ae
      template: "scud-infra-redis"
      name: "SCUD Infra Redis"
      description: "Redis reachability via scud_redis_up gauge on acm /metrics (REDIS_PLUGIN_ABSENT fallback — no redis.info items)."
      groups:
        - name: "Templates/SCUD/Infra"
      items:
        - uuid: 5b56ef3e297c4162bcf2ece011f013d6
          name: "Redis: acm /metrics (master)"
          type: HTTP_AGENT
          key: "scud.infra.redis.metrics"
          delay: 30s
          history: "0"
          trends: "0"
          value_type: TEXT
          url: "http://acm:8004/metrics"
          status_codes: "200"
          timeout: 10s
          description: "Raw Prometheus text from acm /metrics; master for the redis reachability dependent."
        - uuid: 1da7dde391f0455f829b046ff1f0463a
          name: "Redis: reachability (scud_redis_up)"
          type: DEPENDENT
          key: "scud.infra.redis.up"
          value_type: FLOAT
          master_item:
            key: "scud.infra.redis.metrics"
          description: "1 if Redis is reachable as seen by acm, 0 if down. Derived from scud_redis_up gauge via PROMETHEUS_PATTERN."
          preprocessing:
            - type: PROMETHEUS_PATTERN
              parameters:
                - "scud_redis_up"
                - "value"
                - ""

