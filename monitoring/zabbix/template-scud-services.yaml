              parameters:
                - ""
        # --- SLI-C: OTP delivery dependent items ---
        - uuid: 19b3897ce94c469496f2e342dadbc892
          name: "auth_api: OTP issue delivered (sent+queued) rate"
          type: DEPENDENT
          key: "scud.metric.auth_api.scud_otp_issue_delivered"
