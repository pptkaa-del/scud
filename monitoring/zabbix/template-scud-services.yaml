                - "$[?(@.name=='scud_security_events_total')].value.sum()"
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
            - type: SIMPLE_CHANGE
              parameters:
                - ""
        - uuid: 492cefc2ff4749f48d8f8d37c7fb50bd
          name: "user_api: login attempts bad_credential rate"
          type: DEPENDENT
          key: "scud.metric.user_api.scud_login_attempts_total"
          value_type: FLOAT
          master_item:
            key: "scud.metrics.raw[user_api]"
          preprocessing:
            - type: JSONPATH
              parameters:
                - "$[?(@.name=='scud_login_attempts_total' && @.labels.outcome=='bad_credential')].value.sum()"
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
            - type: SIMPLE_CHANGE
              parameters:
                - ""
        - uuid: 104d2e39a1eb41af80356693b9df53f8
          name: "user_api: HTTP 5xx requests"
          type: DEPENDENT
          key: "scud.metric.user_api.scud_http_requests_5xx"
          value_type: FLOAT
          master_item:
            key: "scud.metrics.raw[user_api]"
          preprocessing:
            - type: JSONPATH
              parameters:
                - "$[?(@.name=='scud_http_requests_total' && @.labels.status=~'5..')].value.sum()"
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
            - type: SIMPLE_CHANGE
              parameters:
                - ""
        - uuid: a6507f7c99b043a28ee718ee4c8e2927
          name: "user_api: interservice requests total"
          type: DEPENDENT
          key: "scud.metric.user_api.scud_interservice_requests_total"
          value_type: FLOAT
          master_item:
            key: "scud.metrics.raw[user_api]"
          preprocessing:
            - type: JSONPATH
              parameters:
                - "$[?(@.name=='scud_interservice_requests_total')].value.sum()"
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
            - type: SIMPLE_CHANGE
              parameters:
                - ""
        - uuid: fddb744675624a9d92a9eb2bf2bd6666
          name: "user_api: DB errors total"
          type: DEPENDENT
          key: "scud.metric.user_api.scud_db_errors_total"
          value_type: FLOAT
          master_item:
            key: "scud.metrics.raw[user_api]"
          preprocessing:
            - type: JSONPATH
              parameters:
                - "$[?(@.name=='scud_db_errors_total')].value.sum()"
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
            - type: SIMPLE_CHANGE
              parameters:
                - ""
        - uuid: f06dfa12c3234ad8b0b607712d106ea0
          name: "user_api: interservice errors (error or exhausted)"
          type: DEPENDENT
          key: "scud.metric.user_api.scud_interservice_errors"
          value_type: FLOAT
          master_item:
            key: "scud.metrics.raw[user_api]"
          preprocessing:
            - type: JSONPATH
              parameters:
                - "$[?(@.name=='scud_interservice_requests_total' && @.labels.outcome=~'^(error|exhausted)$')].value.sum()"
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
            - type: SIMPLE_CHANGE
              parameters:
                - ""
      discovery_rules:
        - uuid: a4c09ee035984b359b21a5fc79a73158
          name: "user_api: Prometheus series discovery"
          type: DEPENDENT
          key: "scud.metrics.lld[user_api]"
          delay: "0"
          master_item:
            key: "scud.metrics.raw[user_api]"
          lld_macro_paths:
            - lld_macro: "{#METRIC}"
              path: "$.name"
            - lld_macro: "{#HELP}"
              path: "$.help"
          preprocessing:
            - type: JSONPATH
              parameters:
                - "$[?(@.type=='counter' || @.type=='gauge')]"
          item_prototypes:
            - uuid: 3e016ae9fbe84aff99816b8ce7496b7d
              name: "user_api: {#METRIC}"
              type: DEPENDENT
              key: "scud.series[user_api,{#METRIC}]"
              value_type: FLOAT
              master_item:
                key: "scud.metrics.raw[user_api]"
              preprocessing:
                - type: JSONPATH
                  parameters:
                    - "$[?(@.name=='{#METRIC}')].value.first()"

