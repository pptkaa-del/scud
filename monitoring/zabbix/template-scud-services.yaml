          trends: 90d
          params: "(avg(//scud.metric.auth_api.scud_login_attempts_all,1h) - avg(//scud.metric.auth_api.scud_login_success_no2fa,1h) - avg(//scud.metric.auth_api.scud_login_success_2fa,1h)) / (avg(//scud.metric.auth_api.scud_login_attempts_all,1h) + (avg(//scud.metric.auth_api.scud_login_attempts_all,1h)=0))"
        - uuid: 397ee40904ef4c13b48ff8c28866ef1f
          name: "auth_api: SLI-A login burn rate (fast, 5m)"
          type: CALCULATED
          key: "scud.sli.auth_api.login_burn_fast"
          value_type: FLOAT
          delay: 60s
          history: 7d
          trends: 90d
          params: "avg(//scud.sli.auth_api.login_error_ratio_5m,5m) / 0.005"
        - uuid: 99b8276443d3417e92456805b96b3a66
          name: "auth_api: SLI-A login burn rate (slow, 1h)"
          type: CALCULATED
          key: "scud.sli.auth_api.login_burn_slow"
          value_type: FLOAT
          delay: 60s
          history: 7d
          trends: 90d
          params: "avg(//scud.sli.auth_api.login_error_ratio_1h,1h) / 0.005"
        # --- SLI-C calculated items: OTP delivery error ratio + burn rate ---
        - uuid: 6f5d25d6425a4f48821be77e3fb2dc80
          name: "auth_api: SLI-C OTP delivery error ratio (5m)"
          type: CALCULATED
          key: "scud.sli.auth_api.otp_error_ratio_5m"
          value_type: FLOAT
          delay: 60s
          history: 7d
          trends: 90d
          params: "avg(//scud.metric.auth_api.scud_otp_issue_failed,5m) / (avg(//scud.metric.auth_api.scud_otp_issue_total,5m) + (avg(//scud.metric.auth_api.scud_otp_issue_total,5m)=0))"
        - uuid: c05cbd40a9724f8399fbbf34b6388952
          name: "auth_api: SLI-C OTP delivery error ratio (1h)"
