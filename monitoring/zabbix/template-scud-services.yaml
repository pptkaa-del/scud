        - uuid: e4637e17048d41d282d9ce3dfbb27fd1
          name: "auth_api: SLI-C OTP delivery burn rate (fast, 5m)"
          type: CALCULATED
          key: "scud.sli.auth_api.otp_burn_fast"
          value_type: FLOAT
          delay: 60s
          history: 7d
          trends: 90d
          params: "avg(//scud.sli.auth_api.otp_error_ratio_5m,5m) / 0.01"
        - uuid: ba7ba11ffe2e40d2b2d0ed9afca498d9
          name: "auth_api: SLI-C OTP delivery burn rate (slow, 1h)"
          type: CALCULATED
          key: "scud.sli.auth_api.otp_burn_slow"
          value_type: FLOAT
