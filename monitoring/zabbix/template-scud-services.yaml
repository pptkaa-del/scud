              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
            - type: SIMPLE_CHANGE
              parameters:
                - ""
        # --- SLI-B: command latency histogram bucket items (cumulative — no SIMPLE_CHANGE) ---
        - uuid: 8fb4db79013a4413ac5dc6dba7923dfa
          name: "locker_api: command queue latency bucket le=5.0"
          type: DEPENDENT
          key: "scud.metric.locker_api.scud_cmd_queue_bucket_5s"
          value_type: FLOAT
          master_item:
            key: "scud.metrics.raw[locker_api]"
          preprocessing:
            - type: JSONPATH
              parameters:
                - "$[?(@.name=='scud_command_queue_latency_seconds_bucket' && @.labels.le=='5.0')].value.sum()"
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
        - uuid: e09331cde8e2407a9e4f32c9f0909bac
          name: "locker_api: command queue latency count"
          type: DEPENDENT
          key: "scud.metric.locker_api.scud_cmd_queue_count"
          value_type: FLOAT
          master_item:
            key: "scud.metrics.raw[locker_api]"
          preprocessing:
            - type: JSONPATH
              parameters:
                - "$[?(@.name=='scud_command_queue_latency_seconds_count')].value.sum()"
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
        - uuid: ca8e35bf21664659a26966cc9b08f99a
          name: "locker_api: command ack latency bucket le=5.0"
          type: DEPENDENT
          key: "scud.metric.locker_api.scud_cmd_ack_bucket_5s"
          value_type: FLOAT
          master_item:
            key: "scud.metrics.raw[locker_api]"
          preprocessing:
            - type: JSONPATH
              parameters:
                - "$[?(@.name=='scud_command_ack_latency_seconds_bucket' && @.labels.le=='5.0')].value.sum()"
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
        - uuid: 8d3636d517dd427fb4078b9945011ce4
          name: "locker_api: command ack latency count"
          type: DEPENDENT
          key: "scud.metric.locker_api.scud_cmd_ack_count"
          value_type: FLOAT
          master_item:
            key: "scud.metrics.raw[locker_api]"
          preprocessing:
            - type: JSONPATH
              parameters:
                - "$[?(@.name=='scud_command_ack_latency_seconds_count')].value.sum()"
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
        # --- SLI-B calculated items: command latency SLO fraction + burn rate ---
        - uuid: 3816ff2522ff4df2afec1b810247d8c1
          name: "locker_api: SLI-B command P99 within 5s fraction (5m)"
          type: CALCULATED
          key: "scud.sli.locker_api.cmd_p99_fraction_5m"
          value_type: FLOAT
          delay: 60s
          history: 7d
          trends: 90d
          params: "(avg(//scud.metric.locker_api.scud_cmd_queue_bucket_5s,5m) + avg(//scud.metric.locker_api.scud_cmd_ack_bucket_5s,5m)) / ((avg(//scud.metric.locker_api.scud_cmd_queue_count,5m) + avg(//scud.metric.locker_api.scud_cmd_ack_count,5m)) + ((avg(//scud.metric.locker_api.scud_cmd_queue_count,5m) + avg(//scud.metric.locker_api.scud_cmd_ack_count,5m))=0))"
        - uuid: 2708afde5ef340a9be1e54a74ec66e02
          name: "locker_api: SLI-B command P99 within 5s fraction (1h)"
          type: CALCULATED
          key: "scud.sli.locker_api.cmd_p99_fraction_1h"
          value_type: FLOAT
          delay: 60s
          history: 7d
          trends: 90d
          params: "(avg(//scud.metric.locker_api.scud_cmd_queue_bucket_5s,1h) + avg(//scud.metric.locker_api.scud_cmd_ack_bucket_5s,1h)) / ((avg(//scud.metric.locker_api.scud_cmd_queue_count,1h) + avg(//scud.metric.locker_api.scud_cmd_ack_count,1h)) + ((avg(//scud.metric.locker_api.scud_cmd_queue_count,1h) + avg(//scud.metric.locker_api.scud_cmd_ack_count,1h))=0))"
        - uuid: da8061a2a70c4375b778559fee900657
          name: "locker_api: SLI-B command latency burn rate (fast, 5m)"
          type: CALCULATED
          key: "scud.sli.locker_api.cmd_latency_burn_fast"
          value_type: FLOAT
          delay: 60s
          history: 7d
          trends: 90d
          params: "(1 - avg(//scud.sli.locker_api.cmd_p99_fraction_5m,5m)) / 0.01"
        - uuid: 0c4d09ff2ebd441cb2b1d308e949a214
          name: "locker_api: SLI-B command latency burn rate (slow, 1h)"
          type: CALCULATED
          key: "scud.sli.locker_api.cmd_latency_burn_slow"
          value_type: FLOAT
          delay: 60s
          history: 7d
          trends: 90d
          params: "(1 - avg(//scud.sli.locker_api.cmd_p99_fraction_1h,1h)) / 0.01"
      discovery_rules:
        - uuid: 9484812bf09d4ebb8e29cf16d03afd04
          name: "locker_api: Prometheus series discovery"
          type: DEPENDENT
          key: "scud.metrics.lld[locker_api]"
          delay: "0"
          master_item:
            key: "scud.metrics.raw[locker_api]"
          lld_macro_paths:
            - lld_macro: "{#METRIC}"
              path: "$.name"
            - lld_macro: "{#HELP}"
              path: "$.help"
          preprocessing:
            - type: JSONPATH
              parameters:
                - "$[?(@.type=='counter' || @.type=='gauge')]"
          item_prototypes:
