            - type: SIMPLE_CHANGE
              parameters:
                - ""
        - uuid: dc9f7d9211cb48da8476bfb5d0095256
          name: "auth_api: OTP issue total rate"
          type: DEPENDENT
          key: "scud.metric.auth_api.scud_otp_issue_total"
          value_type: FLOAT
          master_item:
            key: "scud.metrics.raw[auth_api]"
          preprocessing:
            - type: JSONPATH
              parameters:
                - "$[?(@.name=='scud_otp_total' && @.labels.stage=='issue')].value.sum()"
              error_handler: CUSTOM_VALUE
