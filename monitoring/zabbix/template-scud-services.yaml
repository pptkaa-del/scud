        - uuid: 4f4ba0452e4b4f5a975576e5528af2a2
          name: "auth_api: login attempts total rate"
          type: DEPENDENT
          key: "scud.metric.auth_api.scud_login_attempts_all"
          value_type: FLOAT
          master_item:
            key: "scud.metrics.raw[auth_api]"
