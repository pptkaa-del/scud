            - type: SIMPLE_CHANGE
              parameters:
                - ""
        - uuid: 990798041419473c8bff97c3725580e1
          name: "auth_api: OTP delivery failure rate"
          type: DEPENDENT
          key: "scud.metric.auth_api.scud_otp_issue_failed"
          value_type: FLOAT
          master_item:
            key: "scud.metrics.raw[auth_api]"
          preprocessing:
            - type: JSONPATH
              parameters:
                - "$[?(@.name=='scud_otp_total' && @.labels.stage=='issue' && @.labels.outcome=='delivery_unavailable')].value.sum()"
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
            - type: SIMPLE_CHANGE
              parameters:
                - ""
        # --- SLI-A calculated items: login error ratio + burn rate ---
        - uuid: 30bc026d728749febecc4dc566edf59b
          name: "auth_api: SLI-A login error ratio (5m)"
          type: CALCULATED
          key: "scud.sli.auth_api.login_error_ratio_5m"
          value_type: FLOAT
          delay: 60s
          history: 7d
          trends: 90d
          params: "(avg(//scud.metric.auth_api.scud_login_attempts_all,5m) - avg(//scud.metric.auth_api.scud_login_success_no2fa,5m) - avg(//scud.metric.auth_api.scud_login_success_2fa,5m)) / (avg(//scud.metric.auth_api.scud_login_attempts_all,5m) + (avg(//scud.metric.auth_api.scud_login_attempts_all,5m)=0))"
        - uuid: f7fd77d333524a70991d28821d3388fe
          name: "auth_api: SLI-A login error ratio (1h)"
