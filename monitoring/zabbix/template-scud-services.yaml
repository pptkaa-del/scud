---
zabbix_export:
  version: "7.0"
  template_groups:
    - uuid: 02cbee81499c40b39e2bcb6b91427aca
      name: "Templates/SCUD"

  templates:

    # -------------------------------------------------------------------------
    # user_api  (port 8000)
    # -------------------------------------------------------------------------
    - uuid: 7d1f129a40c746bb8fa36ed9fad5fc09
      template: "scud-service-user_api"
      name: "SCUD Service user_api"
      description: "Scrapes /metrics from user_api and exposes key SCUD series as Zabbix items."
      groups:
        - name: "Templates/SCUD"
      items:
        - uuid: 1035d41e990144ca80986584c02e4fea
          name: "user_api: raw /metrics"
          type: HTTP_AGENT
          key: "scud.metrics.raw[user_api]"
          delay: 30s
          history: "0"
          trends: "0"
          value_type: TEXT
          url: "http://user_api:8000/metrics"
          status_codes: "200"
          timeout: 10s
          preprocessing:
            - type: PROMETHEUS_TO_JSON
              parameters:
                - ""
        - uuid: d572263102f346a3ba1e9230854aa8e0
          name: "user_api: HTTP requests total"
          type: DEPENDENT
          key: "scud.metric.user_api.scud_http_requests_total"
          value_type: FLOAT
          master_item:
            key: "scud.metrics.raw[user_api]"
          preprocessing:
            - type: JSONPATH
              parameters:
                - "$[?(@.name=='scud_http_requests_total')].value.sum()"
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
            - type: SIMPLE_CHANGE
              parameters:
                - ""
        - uuid: 80bc06f75ba3424aa6f7d56fce31f7ec
          name: "user_api: HTTP request duration sum"
          type: DEPENDENT
          key: "scud.metric.user_api.scud_http_request_duration_seconds"
          value_type: FLOAT
          master_item:
            key: "scud.metrics.raw[user_api]"
          preprocessing:
            - type: JSONPATH
              parameters:
                - "$[?(@.name=='scud_http_request_duration_seconds_sum')].value.sum()"
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
        - uuid: bfa0c8e9b6c942e59e38ae696762b9a0
          name: "user_api: DB pool waiters"
          type: DEPENDENT
          key: "scud.metric.user_api.scud_db_pool_connections_waiters"
          value_type: FLOAT
          master_item:
            key: "scud.metrics.raw[user_api]"
          preprocessing:
            - type: JSONPATH
              parameters:
                - "$[?(@.name=='scud_db_pool_connections_waiters')].value.sum()"
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
        - uuid: 6f1fc0d25f66440bb6d89edd1eed8007
          name: "user_api: command lifecycle ack_timeout_failed rate"
          type: DEPENDENT
          key: "scud.metric.user_api.scud_command_lifecycle_ack_timeout_failed"
          value_type: FLOAT
          master_item:
            key: "scud.metrics.raw[user_api]"
          preprocessing:
            - type: JSONPATH
              parameters:
                - "$[?(@.name=='scud_command_lifecycle_total' && @.labels.transition=='ack_timeout_failed')].value.sum()"
              error_handler: CUSTOM_VALUE
              error_handler_params: "0"
            - type: SIMPLE_CHANGE
              parameters:
                - ""
        - uuid: 369e0aebc1dd4267835823f2f8386e2b
          name: "user_api: security events total"
          type: DEPENDENT
          key: "scud.metric.user_api.scud_security_events_total"
          value_type: FLOAT
          master_item:
            key: "scud.metrics.raw[user_api]"
          preprocessing:
            - type: JSONPATH
